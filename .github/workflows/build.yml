name: Build Flet APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Обновлено до v5, чтобы убрать ошибку deprecated
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
              
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies locally
        run: pip install -r requirements.txt
      
      - name: Build APK
        # Компилятор сам прочтет requirements.txt, не споткнется об customtkinter и правильно вошьет диктофон
        run: flet build apk --module-name main --android-permissions android.permission.RECORD_AUDIO=true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/*.apk'
